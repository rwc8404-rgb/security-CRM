const DATEFIELDS={
 prospects:[['lastContact','Last Contact Date'],['walkSched','Site Walk Scheduled'],['inspDue','Next Inspection Due'],['contractExp','Monitoring Contract Expires'],['permitExp','Permit / Cert Renewal']],
 pipeline:[['followup','Next Follow-up Date'],['quoteSent','Quote Sent Date'],['statusDate','Status Date'],['entered','Date Entered Pipeline']],
 won:[['won','Date Won'],['followup','Next Follow-up Date'],['entered','Date Entered Pipeline'],['inspDue','Next Inspection Due'],['contractExp','Monitoring Contract Expires'],['permitExp','Permit / Cert Renewal']]
};
function defaultRules(){return [
 {id:uid(),enabled:true,label:'First touch — new prospect',source:'prospects',trig:{type:'daysSince',field:'lastContact',days:3},filter:null,priority:'high',action:'Call',advanceDays:3,template:'First outreach to {company}'},
 {id:uid(),enabled:true,label:'Site walk — day-of reminder',source:'prospects',trig:{type:'dateDue',field:'walkSched',days:0},filter:null,priority:'high',action:'Site Walk',advanceDays:0,template:'Site walk today: {company}'},
 {id:uid(),enabled:true,label:'Nurture — no contact in 7 days',source:'prospects',trig:{type:'daysSince',field:'lastContact',days:7},filter:null,priority:'normal',action:'Call',advanceDays:7,template:'Check in with {company}'},
 {id:uid(),enabled:true,label:'Pipeline follow-up due',source:'pipeline',trig:{type:'dateDue',field:'followup',days:0},filter:{field:'status',val:'Open'},priority:'high',action:'Call',advanceDays:3,template:'Follow up: {company}'},
 {id:uid(),enabled:true,label:'Chase quote — 3 days, no answer',source:'pipeline',trig:{type:'daysSince',field:'quoteSent',days:3},filter:{field:'status',val:'Open'},priority:'high',action:'Call',advanceDays:4,template:'Chase quote with {company}'},
 {id:uid(),enabled:true,label:'Stale deal — 14 days no movement',source:'pipeline',trig:{type:'daysSince',field:'statusDate',days:14},filter:{field:'status',val:'Open'},priority:'normal',action:'Email',advanceDays:7,template:'Re-engage {company} (stalled)'},
 {id:uid(),enabled:true,label:'New client check-in (14 days)',source:'won',trig:{type:'daysAfter',field:'won',days:14},filter:null,priority:'normal',action:'Call',advanceDays:0,template:'Post-install check-in: {company}'},
 {id:uid(),enabled:true,label:'Won — service follow-up due',source:'won',trig:{type:'dateDue',field:'followup',days:0},filter:null,priority:'normal',action:'Call',advanceDays:30,template:'Service check-in: {company}'}
];}
function todayISO(){const d=new Date();d.setHours(0,0,0,0);return d.toISOString().slice(0,10);}
function addDaysISO(iso,n){const d=parseD(iso);if(!d)return null;d.setDate(d.getDate()+(+n||0));return d.toISOString().slice(0,10);}
function ruleFieldLabel(src,f){const a=(DATEFIELDS[src]||[]).find(x=>x[0]===f);return a?a[1]:f;}
function ruleDueISO(rule,rec){
 const v=rec[rule.trig.field];
 if(rule.trig.type==='dateDue'){const d=parseD(v);return d?d.toISOString().slice(0,10):null;}
 if(rule.trig.type==='daysSince'){if(!v)return todayISO();return addDaysISO(v,rule.trig.days);}
 if(rule.trig.type==='daysAfter'){if(!v)return null;return addDaysISO(v,rule.trig.days);}
 if(rule.trig.type==='daysBefore'){if(!v)return null;return addDaysISO(v,-Math.abs(rule.trig.days||0));}
 return null;
}
function passFilter(rule,rec){if(!rule.filter||!rule.filter.field)return true;return (rec[rule.filter.field]||'')===rule.filter.val;}
const PRANK={high:0,normal:1,low:2};

function getTasks(){
 if(cachedTasks)return cachedTasks;
 const todayStr=todayISO();const winStr=addDaysISO(todayStr,DB.settings.upcomingDays||7);
 const out={};
 (DB.rules||[]).filter(r=>r.enabled).forEach(rule=>{
  (DB[rule.source]||[]).forEach((rec,idx)=>{
   if(!rec.company||!passFilter(rule,rec))return;
   const dueISO=ruleDueISO(rule,rec);if(!dueISO||dueISO>winStr)return;
   if(rule.trig.type==='daysBefore'&&rec[rule.trig.field]<addDaysISO(todayStr,-30))return;
   const rid=rec._id||(rule.source+idx);
   const key=`${rule.id}:${rid}:${dueISO}`;
   const dedupe=`${rule.source}:${rid}:${rule.action}`;
   const t={key,dedupe,ruleId:rule.id,source:rule.source,recIdx:idx,company:rec.company,
     title:(rule.template||'{company}').replace('{company}',rec.company),
     priority:rule.priority||'normal',action:rule.action||'Call',dueISO,overdue:dueISO<todayStr,
     advanceField:rule.trig.field,advanceDays:rule.advanceDays||0,advanceType:rule.trig.type,done:!!DB.done[key]};
   const ex=out[dedupe];if(!ex||t.dueISO<ex.dueISO)out[dedupe]=t;
  });
 });
 let list=Object.values(out);
 (DB.tasks||[]).forEach((m,i)=>{const dueISO=(m.due||todayStr);if(dueISO>winStr)return;
  list.push({key:'manual:'+(m._id||i),source:'manual',company:m.company||'',title:m.title||'Task',priority:m.priority||'normal',action:'',dueISO,overdue:dueISO<todayStr&&!m.done,manualIdx:i,done:!!m.done});});
 list.sort((a,b)=>(a.done-b.done)||(a.dueISO<b.dueISO?-1:a.dueISO>b.dueISO?1:0)||(PRANK[a.priority]-PRANK[b.priority]));
 cachedTasks=list;
 return list;
}

/* Targeted in-place task completion without wiping Today screen DOM */
function completeTask(key, btnEl){
 const list=getTasks();const t=list.find(x=>x.key===key);if(!t)return;
 const cardEl=btnEl?.closest('.task');
 if(key.startsWith('manual:')){
  if(DB.tasks[t.manualIdx]){
   DB.tasks[t.manualIdx].done=!DB.tasks[t.manualIdx].done;
   saveDB();
   if(cardEl)cardEl.classList.toggle('is-done',DB.tasks[t.manualIdx].done);
   updateTodayCounters();
  }
  return;
 }
 if(DB.done[key]){
  delete DB.done[key];
  saveDB();
  if(cardEl)cardEl.classList.remove('is-done');
  updateTodayCounters();
  return;
 }
 DB.done[key]=todayISO();
 const act=indexRecord({_id:uid(),date:todayISO(),company:t.company,activity:t.action||'Call',notes:'✓ '+t.title,logged:'',touch:t.source==='prospects'?'New Prospect':'Pipeline'});
 DB.activity.push(act);
 const rec=DB[t.source][t.recIdx];
 if(rec){
  if(t.advanceType==='daysSince')rec[t.advanceField]=todayISO();
  else if(t.advanceType==='dateDue'&&t.advanceDays>0)rec[t.advanceField]=addDaysISO(todayISO(),t.advanceDays);
  indexRecord(rec);
 }
 saveDB();
 if(cardEl)cardEl.classList.add('is-done');
 updateTodayCounters();
 toast('Done — logged & rescheduled');
}

function csvCell(v){const s=v==null?'':String(v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function toCSV(tab){
 const cols=TRACKER[tab].cols;const rows=DB[tab]||[];
 const head=cols.map(c=>csvCell(c.l)).join(',');
 const body=rows.map(r=>cols.map(c=>csvCell(r[c.k])).join(',')).join('\r\n');
 return head+(body?'\r\n'+body:'');
}
function parseCSV(text){
 const rows=[];let row=[],cell='',q=false;
 text=text.replace(/^\uFEFF/,'');
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
  else if(c==='"')q=true;
  else if(c===','){row.push(cell);cell='';}
  else if(c==='\n'){row.push(cell);cell='';rows.push(row);row=[];}
  else if(c!=='\r')cell+=c;
 }
 if(cell!==''||row.length){row.push(cell);rows.push(row);}
 return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function download(name,text,type){
 try{
  const blob=new Blob([text],{type:type||'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);
 }catch(e){toast('Download failed');}
}

 const heads=rows[0].map(h=>byLabel[norm(h)]||byKey[norm(h)]||null);

}

let recog=null,recogBtn=null;
function voiceSupported(){return 'webkitSpeechRecognition' in window||'SpeechRecognition' in window;}
function startDictation(btn){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
 const ta=btn.parentElement.querySelector('textarea');if(!ta)return;
 if(recog){try{recog.stop();}catch(e){}const same=recogBtn===btn;recog=null;if(recogBtn)recogBtn.classList.remove('rec');recogBtn=null;if(same)return;}
 recog=new SR();recog.lang='en-US';recog.interimResults=false;recog.continuous=true;recogBtn=btn;btn.classList.add('rec');
 recog.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal){const tx=e.results[i][0].transcript.trim();if(tx)ta.value=(ta.value?ta.value.replace(/\s*$/,'')+' ':'')+tx;}}ta.dispatchEvent(new Event('input',{bubbles:true}));};
 recog.onerror=()=>{btn.classList.remove('rec');recog=null;recogBtn=null;};
 recog.onend=()=>{btn.classList.remove('rec');recog=null;recogBtn=null;};
 try{recog.start();}catch(e){btn.classList.remove('rec');recog=null;recogBtn=null;}
}

 $$('#screen-walk .acc').forEach(acc=>{
  const body=acc.querySelector('.acc-body');const cnt=acc.querySelector('.cnt');if(!body||!cnt)return;
  const a=acc.dataset.acc||'';if(!(a==='previsit'||a==='site'||a.startsWith('sys_')))return;
  const keys={};
  $$('[data-fk]',body).forEach(inp=>{
   if(inp.closest('[data-table]'))return;
   const k=inp.dataset.fk;
   keys[k]=keys[k]||has(walkState,k);
  });
  const total=Object.keys(keys).length;const done=Object.values(keys).filter(Boolean).length;
  if(total){cnt.textContent=`${done}/${total}`;cnt.classList.toggle('done',done===total);cnt.classList.toggle('part',done>0&&done<total);}
 });
}
function updateLiveMedd(){
 const box=$('#liveMedd');if(!box)return;
 if(!selectedSystems.length){box.innerHTML='';return;}
 const R=evalMeddpicc(walkState);const cap=R.filter(r=>r.ok).length;
 box.innerHTML=`<div class="lm-top"><span class="lm-ttl">MEDDPICC readiness</span><span class="lm-n">${cap}/8 captured</span></div>
   <div class="lm-dots">${R.map(r=>`<span class="lm-dot ${r.ok?'ok':''}" title="${esc(r.el)}: ${esc(r.msg)}">${esc(r.sub)}</span>`).join('')}</div>`;
}

let topView='walk',walkStep=0;
const WALKSCREENS=['screen-walk','screen-summary','screen-gap'];
const TAGS={walk:['SITE WALK','PROPOSAL SUMMARY','GAP REPORT'],today:'TODAY',tracker:'TRACKER',reports:'REPORTS',dash:'DASHBOARD',admin:'FOLLOW-UP ADMIN'};

function ensureScreenBuilt(v) {
 if (v === 'today' && screenDirty.today) buildToday();
 else if (v === 'tracker' && screenDirty.tracker) buildTracker();
 else if (v === 'dash' && screenDirty.dash) buildDashboard();
 else if (v === 'reports' && screenDirty.reports) buildReports();
 else if (v === 'admin' && screenDirty.admin) buildAdmin();
}

function showTop(v){
 topView=v;
 ensureScreenBuilt(v);
 $$('.screen').forEach(x=>x.classList.remove('active'));
 if(v==='walk')$('#'+WALKSCREENS[walkStep]).classList.add('active');
 else $('#screen-'+v).classList.add('active');
 $$('.navbtn').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
 $('#viewTag').textContent=v==='walk'?TAGS.walk[walkStep]:TAGS[v];
 $('#stepbar').classList.toggle('show',v==='walk');
 if(v==='walk')renderProgress();
 window.scrollTo(0,0);
}
function renderProgress(){
 $('#stepProgress').innerHTML=[0,1,2].map(i=>`<span class="pdot ${i<walkStep?'done':i===walkStep?'cur':''}"></span>`).join('');
 $('#stepBack').style.visibility=walkStep===0?'hidden':'visible';
 $('#stepNext').innerHTML=walkStep===2?`Done${svg('check')}`:`Next${svg('check')}`;
}
function goStep(n){
 if(n===1&&walkStep===0){if(!generate())return;}
 walkStep=Math.max(0,Math.min(2,n));
 showTop('walk');
}
function generate(){
 if(!selectedSystems.length){toast('Select at least one system');return false;}
 lastWalk=getCleanWalkSnapshot();
 if(!G(lastWalk,'pv_company')){toast('Enter a company name');$('[data-acc="previsit"]').classList.add('open');window.scrollTo(0,0);return false;}
 buildSummary();buildGap();
 return true;
}
function updateStrip(){
 const acct=walkState.fields.pv_company||'No active walk';
 $('#ssAcct').textContent=acct;
 $$('#statusStrip .led').forEach(l=>l.classList.toggle('on',selectedSystems.includes(l.dataset.sys)));
}


/* =============== GOOGLE DRIVE BACKUP =============== */
let gdToken=null,gdExp=0;
function gdLoadLib(){return new Promise((res,rej)=>{
 if(window.google&&google.accounts&&google.accounts.oauth2)return res();
 const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';
 sc.onload=()=>res();sc.onerror=()=>rej(new Error('Could not load Google sign-in (offline?)'));document.head.appendChild(sc);});}
async function gdAuth(){
 const g=DB.settings.gdrive;
 if(!g.clientId)throw new Error('Enter your Client ID first');
 if(gdToken&&Date.now()<gdExp)return gdToken;
 await gdLoadLib();
 return new Promise((res,rej)=>{
  const tc=google.accounts.oauth2.initTokenClient({client_id:g.clientId,scope:'https://www.googleapis.com/auth/drive.file',
   callback:r=>{if(r.error)return rej(new Error(r.error));gdToken=r.access_token;gdExp=Date.now()+((+r.expires_in||3600)-60)*1000;res(gdToken);},
   error_callback:e=>rej(new Error((e&&e.type)||'Sign-in cancelled'))});
  tc.requestAccessToken();
 });
}
async function gdApi(url,opts){
 const t=await gdAuth();
 const r=await fetch(url,Object.assign({},opts,{headers:Object.assign({Authorization:'Bearer '+t},(opts&&opts.headers)||{})}));
 if(!r.ok){if(r.status===401)gdToken=null;throw new Error('Drive error '+r.status);}
 return r.json();
}
async function gdFolderId(){
 const g=DB.settings.gdrive;
 if(g.folderId){
  try{const f=await gdApi('https://www.googleapis.com/drive/v3/files/'+g.folderId+'?fields=id,name,trashed');
   if(!f.trashed&&f.name===g.folder)return g.folderId;}catch(e){}
 }
 const nm=g.folder.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
 const q=encodeURIComponent(`name='${nm}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
 const l=await gdApi('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+q);
 let id=l.files&&l.files[0]&&l.files[0].id;
 if(!id){const c=await gdApi('https://www.googleapis.com/drive/v3/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:g.folder,mimeType:'application/vnd.google-apps.folder'})});id=c.id;}
 g.folderId=id;saveDB();return id;
}
async function gdBackup(){
 const g=DB.settings.gdrive;
 if(!g.clientId){toast('Enter Client ID first');return;}
 if(!g.folder.trim()){toast('Enter a folder name');return;}
 const btn=$('#gdBackup');if(btn)btn.disabled=true;
 try{
  toast('Connecting to Google…');
  const folder=await gdFolderId();
  const name=`ENCS_FieldConsole_Backup_${stamp()}.json`;
  const q=encodeURIComponent(`name='${name}' and '${folder}' in parents and trashed=false`);
  const ex=await gdApi('https://www.googleapis.com/drive/v3/files?fields=files(id)&q='+q);
  const fid=ex.files&&ex.files[0]&&ex.files[0].id;
  const b='encsbnd'+uid();
  const meta=fid?{name}:{name,parents:[folder]};
  const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(DB)}\r\n--${b}--`;
  await gdApi('https://www.googleapis.com/upload/drive/v3/files'+(fid?'/'+fid:'')+'?uploadType=multipart&fields=id',{method:fid?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});
  toast('Saved to Drive: '+g.folder);
 }catch(e){toast(e.message||'Drive backup failed');}
 finally{if(btn)btn.disabled=false;}
}

 const add=e.target.closest('[data-addrow]');if(add){addTableRow(add.dataset.addrow);scheduleDraftSave();return;}

   if(walkState.photos[fk])walkState.photos[fk]=walkState.photos[fk].filter(x=>x!==pid);
  }

 }
 const rt=e.target.closest('.rowthumb');
 if(rt&&!rt.hidden){

 if(e.target.closest('#outdoorBtn')){const on=!document.body.classList.contains('outdoor');applyOutdoor(on);try{localStorage.setItem(OUTKEY,on?'1':'0');}catch(_){}return;}

 const tk=e.target.closest('[data-task]');if(tk){completeTask(tk.dataset.task,tk);return;}

 if(e.target.closest('#addRule')){openRuleModal(null);return;}

document.addEventListener('change',async e=>{
 const fi=e.target.closest('input[type="file"][data-photo]');
 if(fi){
  const files=[...(fi.files||[])];if(!files.length)return;
  if(fi.dataset.photo==='row'){
   const td=fi.closest('.photocell');const img=td.querySelector('.rowthumb');
   const tr=td.closest('tr');
   const tblKey=tr.closest('table[data-table]').dataset.table;
   const rowIdx=[...tr.parentElement.children].indexOf(tr);
   const blob=await downscaleToBlob(files[0]);
   if(blob){
    const pid='ph_'+uid();
    await PhotoStore.save(pid,blob);
    const url=await PhotoStore.getURL(pid);
    img.src=url;img.dataset.photoid=pid;img.hidden=false;td.classList.add('has');
    walkState.tables[tblKey]=walkState.tables[tblKey]||[];
    while(walkState.tables[tblKey].length<=rowIdx)walkState.tables[tblKey].push({});
    walkState.tables[tblKey][rowIdx]._photo=pid;
   }
  } else {
   const fk=fi.dataset.target;
   const strip=$(`[data-photofield="${fk}"]`);
   walkState.photos[fk]=walkState.photos[fk]||[];
   for(const f of files){
    const blob=await downscaleToBlob(f);
    if(blob&&strip){
     const pid='ph_'+uid();
     await PhotoStore.save(pid,blob);
     const url=await PhotoStore.getURL(pid);
     walkState.photos[fk].push(pid);
     strip.insertAdjacentHTML('beforeend',thumbHTML(url,pid));
    }
   }
  }
  fi.value='';scheduleDraftSave();return;
 }
 if(e.target.id==='impBackup'||e.target.id==='impCsv'){
  const f=(e.target.files||[])[0];const which=e.target.id;const tgt=$('#impTarget')?.value||'prospects';
  e.target.value='';
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{which==='impBackup'?restoreBackup(String(rd.result)):importCSV(tgt,String(rd.result));};
  rd.onerror=()=>toast('Could not read that file');
  rd.readAsText(f);return;
 }
 if(e.target.matches&&e.target.matches('[data-rfield]')){
  RPT.fields=$$('#screen-reports [data-rfield]').filter(i=>i.checked).map(i=>i.dataset.rfield);
  if(RPT.sortK&&!RPT.fields.includes(RPT.sortK))RPT.sortK='';
  buildReports();return;
 }
 const rsel=e.target.closest('[data-rsel]');if(rsel){RPT.sel[rsel.dataset.rsel]=rsel.value;renderReportOutput();return;}
 const rdf=e.target.closest('[data-rdatefield]');if(rdf){RPT.dateField=rdf.value;renderReportOutput();return;}
 if(e.target.id==='rFrom'){RPT.from=e.target.value;renderReportOutput();return;}
 if(e.target.id==='rTo'){RPT.to=e.target.value;renderReportOutput();return;}
 if(e.target.id==='rSortK'){RPT.sortK=e.target.value;renderReportOutput();return;}
 if(e.target.id==='rSortDir'){RPT.sortDir=e.target.value;renderReportOutput();return;}
 const rksrc=e.target.closest('[data-rk="source"]');
 if(rksrc){const tf=$('#modalBody [data-rk="tfield"]');if(tf){const opts=DATEFIELDS[rksrc.value]||[];tf.innerHTML=opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('');}return;}

 /* Targeted in-place rule toggle without rebuilding Admin screen */
 const rtg=e.target.closest('[data-ruletoggle]');
 if(rtg){
  const idx=+rtg.dataset.ruletoggle;
  DB.rules[idx].enabled=rtg.checked;
  saveDB();
  rtg.closest('.rule')?.classList.toggle('off',!rtg.checked);

 const tg=e.target.closest('[data-tgt]');
 if(tg){
  const [k,i]=tg.dataset.tgt.split(':');DB.settings.targets[k][+i]=Math.max(0,+tg.value||0);
  if(DB.settings.targets[k][1]<DB.settings.targets[k][0])DB.settings.targets[k][1]=DB.settings.targets[k][0];
  saveDB();return;
 }
 if(e.target.id==='gdClient'){DB.settings.gdrive.clientId=e.target.value.trim();gdToken=null;saveDB();return;}
 if(e.target.id==='gdFolder'){DB.settings.gdrive.folder=e.target.value.trim();DB.settings.gdrive.folderId='';saveDB();return;}
 if(e.target.id==='setWindow'){DB.settings.upcomingDays=Math.max(0,+e.target.value||0);saveDB();refreshTaskBadgeOnly();return;}
 if(e.target.closest&&e.target.closest('#screen-walk')){
  syncWalkStateFromInput(e.target);
  scheduleDraftSave();scheduleLive();
 }
});
